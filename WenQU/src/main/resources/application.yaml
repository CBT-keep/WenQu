spring:
  application:
    name: WenQU

  #文件上传配置
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:mysql://localhost:3306/wenqu
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
    secret: ICAgV2VuUXUyMDI2MDgxMDIwMjkwOTEwCg==
    expiration: 7200

wenqu:
  upload-dir: ./uploads
  register:
    # 注册邀请码，逗号分隔；留空表示关闭注册。更换/作废邀请码只需改这里并重启
    invite-codes: WENQU-2026

ollama:
  base-url: http://localhost:11434
  model: nomic-embed-text
  dimensions: 768
  batch-size: 16
  timeout-seconds: 120