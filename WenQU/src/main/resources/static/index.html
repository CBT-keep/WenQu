<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WenQu · 终端知识库</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== AUTH: TERMINAL LOGIN ==================== -->
<div id="auth-view" class="view active">
  <div class="auth-box">
    <div class="auth-terminal">
      <div class="auth-term-head">
        <div class="dots"><div class="d r"></div><div class="d y"></div><div class="d g"></div></div>
        <div class="title" id="auth-term-title">wenqu — bash — 80×24</div>
      </div>
      <div class="auth-term-body" id="auth-output">
        <div class="term-line"><span class="term-ok">WenQu</span> <span class="term-muted">Personal Knowledge Base + RAG</span></div>
        <div class="term-line term-muted">-------------------------------------------</div>
        <div class="term-line">输入 <span class="term-hl">help</span> 查看可用命令</div>
        <div class="term-line term-muted">&nbsp;</div>
      </div>
      <div style="display:flex;align-items:center;padding:8px 16px;border-top:1px solid var(--border);gap:8px">
        <span class="term-prompt" id="term-prompt">kb&gt;</span>
        <div class="term-input-wrap">
          <span class="term-text-mirror" id="auth-mirror-before"></span>
          <span class="term-cursor-char" id="auth-cursor"></span>
          <span class="term-text-mirror" id="auth-mirror-after"></span>
          <input id="auth-input" class="term-input" autocomplete="off" placeholder="输入命令..." autofocus>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app-view" class="view">
  <header class="app-header">
    <button class="app-menu-btn" id="btn-app-menu" title="菜单">☰</button>
    <div class="dots"><div class="d r"></div><div class="d y"></div><div class="d g"></div></div>
    <div class="title" id="app-term-title">wenqu — bash — 80×24</div>
    <div class="spacer"></div>
    <div class="user-info">Hi, <span id="header-user">-</span></div>
    <button class="theme-toggle" id="app-theme-btn" title="切换主题">☽</button>
    <button class="btn-sm btn-ghost" id="btn-term">终端</button>
    <button class="btn-sm btn-ghost" id="btn-logout">登出</button>
  </header>
  <div class="app-body" id="app-body">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="row">
          <input id="kb-search" placeholder="搜索知识库…" style="flex:1">
          <button class="btn-sm" id="btn-new-kb" title="新建知识库"><span class="btn-label">新建</span></button>
        </div>
      </div>
      <div class="sidebar-title">知识库</div>
      <div class="sidebar-list" id="kb-list"></div>
      <div class="sidebar-footer">
        <button class="btn-sm" style="width:100%" id="btn-new-chat" title="新对话"><span class="btn-label">新对话</span></button>
      </div>
    </aside>
    <button class="sidebar-caret" id="sidebar-caret" title="折叠/展开侧边栏">◀</button>

    <!-- CONTENT -->
    <div class="content" id="content-area">
      <div id="kb-view">
        <div class="content-header">
          <h2 id="kb-title">选择一个知识库</h2>
          <button class="btn-sm" id="btn-upload-doc" style="display:none">上传文档</button>
          <button class="btn-sm" id="btn-edit-kb" style="display:none">编辑</button>
          <button class="btn-sm btn-err" id="btn-del-kb" style="display:none">删除</button>
          <button class="btn-sm" id="btn-start-chat" style="display:none">开始对话</button>
        </div>
        <div class="content-body" id="kb-body">
          <div class="empty-state" id="kb-empty">
            <div class="icon">kb&gt;</div>
            <p>选择左侧知识库查看详情<br>或点击 <b>+</b> 创建新知识库</p>
          </div>
        </div>
      </div>

      <div id="chat-view" style="display:none;flex-direction:column;height:100%">
        <div class="content-header">
          <button class="btn-sm btn-ghost back-btn" id="btn-back-kb">← 返回</button>
          <h2 id="chat-title">对话</h2>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
          <input id="chat-input" placeholder="输入问题…" autocomplete="off">
          <button id="btn-send">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== MODALS ==================== -->
<div class="modal-overlay" id="modal-kb">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-kb-title">新建知识库</h3><button class="btn-sm btn-ghost" id="modal-kb-close">✕</button></div>
    <div class="modal-body">
      <label>名称 *</label>
      <input id="mk-name" placeholder="例：Java 学习笔记">
      <label>描述</label>
      <input id="mk-desc" placeholder="可选描述">
      <label>分块大小 (200~800)</label>
      <input id="mk-chunk" type="number" min="200" max="800" value="400">
      <label>重叠 (10~200)</label>
      <input id="mk-overlap" type="number" min="10" max="200" value="80">
      <div class="err-msg" id="mk-err" style="color:var(--err);font-size:12px;min-height:18px"></div>
    </div>
    <div class="modal-foot">
      <button id="modal-kb-cancel">取消</button>
      <button id="modal-kb-ok">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-upload">
  <div class="modal">
    <div class="modal-head"><h3>上传文档</h3><button class="btn-sm btn-ghost" id="modal-upload-close">✕</button></div>
    <div class="modal-body">
      <label>选择文件 (.txt / .md / .docx，≤20MB)</label>
      <input type="file" id="upload-file" accept=".txt,.md,.docx">
      <div class="err-msg" id="upload-err" style="color:var(--err);font-size:12px;min-height:18px"></div>
    </div>
    <div class="modal-foot">
      <button id="modal-upload-cancel">取消</button>
      <button id="modal-upload-ok">上传</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>
<input type="file" id="term-file-input" accept=".txt,.md,.docx" style="display:none">

<script src="js/app.js"></script>
</body>
</html>
