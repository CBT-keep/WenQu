name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一分支上的新推送自动取消旧任务，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / build & test
    runs-on: ubuntu-latest
    # BackendApplicationTests 是 @SpringBootTest，启动时要跑 Flyway 迁移，必须有真实 PG
    # 数据库（与 docker-compose.yml 保持一致）。服务由 runner 起在 localhost:5432。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: wenqu
          POSTGRES_USER: wenqu
          POSTGRES_PASSWORD: wenqu@123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wenqu -d wenqu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build & test
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp verify

  frontend:
    name: frontend / lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
