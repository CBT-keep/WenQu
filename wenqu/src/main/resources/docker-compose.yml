# WenQu · 本地开发基础设施 #
# 只需三个服务：PostgreSQL（含 pgvector）/ Redis / RabbitMQ。
# 常用命令：
#   docker compose up -d          # 启动
#   docker compose ps             # 查看状态（等 STATUS 变为 healthy）
#   docker compose logs -f        # 跟随日志
#   docker compose down           # 停止（保留数据卷）
#   docker compose down -v        # 停止并删除数据卷（数据不可恢复，慎用）
#
# ⚠️ 国内网络拉取镜像慢或超时，见 doc/05-开发文档.md §2.3 配置镜像加速器。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wenqu-postgres
    environment:
      POSTGRES_DB: wenqu
      POSTGRES_USER: wenqu
      POSTGRES_PASSWORD: wenqu@123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动执行：建 vector 扩展。表结构由后端 Flyway 负责，不放在这里。
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    # 并行构建 HNSW 索引需要更大的共享内存（>= maintenance_work_mem）
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenqu -d wenqu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wenqu-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: wenqu-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    # 管理台 http://localhost:15672（wenqu / wenqu@123）
    environment:
      RABBITMQ_DEFAULT_USER: wenqu
      RABBITMQ_DEFAULT_PASS: wenqu@123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
