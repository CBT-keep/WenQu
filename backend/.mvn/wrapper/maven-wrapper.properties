wrapperVersion=3.3.4
distributionType=only-script
# 走华为云 Apache 镜像：国内可直连，且 GitHub Actions 的境外机器也能访问
# （阿里云镜像对境外 IP 不稳定，会导致 CI 里 ./mvnw 下载超时失败）。
# 若该地址不可用，可替换为：
#   阿里云 https://mirrors.aliyun.com/apache/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.zip
#           （国内快，但境外机器不可用）
#   官方源 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.zip
#           （境外快，但国内直连易卡死）
distributionUrl=https://repo.huaweicloud.com/apache/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.zip
