spring:
  application:
    name: backend

  # 本地基础设施由 docker-compose.yml 提供：
  #   PostgreSQL 16 + pgvector → localhost:5432
  #   Redis 7                  → localhost:6379
  #   RabbitMQ 3.13            → localhost:5672
  datasource:
    url: jdbc:postgresql://localhost:5432/wenqu
    username: wenqu
    password: wenqu@123
    driver-class-name: org.postgresql.Driver

  # 表结构由 Flyway 维护，脚本位于 src/main/resources/db/migration
  # baseline-on-migrate: 库中已有 vector 扩展等对象时避免 "non-empty schema" 报错
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # clean-disabled: true

jwt:
  secret: ${JWT_SECRET:14c8ededd143493c8d805e9777466ff2a34f3f2f4de4463491713eabe29449764e5cdb3101aa4418b52cce19bda1b10c}
  access-token-ttl-seconds: 7200     # 120 分钟
  refresh-token-ttl-seconds: 604800  # 7 天

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO
  pattern:
    level: "%5p [%X{traceId:-}]"

# 业务持久层统一使用 MyBatis，SQL 按模块存放
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    # 写入和异步操作可能在不同 SqlSession，避免跨查询复用陈旧状态
    local-cache-scope: STATEMENT

# 文档列表由 PageHelper 生成分页 SQL 与总数查询
pagehelper:
  helper-dialect: postgresql
  reasonable: false
  page-size-zero: false


crypto:
  # AES-GCM 密钥（32 字节原始密钥，base64编码后传入环境变量），用于加密 apiKey / 数据源密码
  aes-key: ${WENQU_AES_KEY:qwertyuiopasdfghjklzxcvbnm1q8a6s8e}

